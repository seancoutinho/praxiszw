<!doctype html>
<html lang="en-ZW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2559">
<title>Offline · Praxis Studio</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfaf7; color: #14181f;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; padding: 1.5rem; }
  main { max-width: 26rem; background: #fff; border: 1px solid #e3dfd5; border-radius: 14px; padding: 2rem; }
  .mark { width: 2.25rem; height: 2.25rem; border-radius: 8px; background: #0b2559; color: #fff; display: grid; place-items: center; font-weight: 900; }
  h1 { font-size: 1.375rem; color: #061733; margin: 1.25rem 0 0.5rem; line-height: 1.25; }
  p { color: #3d444f; margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 700; font-size: 0.875rem; background: #0b2559; color: #fff; border: 0; border-radius: 4px; padding: 0.8rem 1.4rem; cursor: pointer; }
  button:hover { background: #133272; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">P</div>
  <h1>You’re offline</h1>
  <p>This page hasn’t been opened on this device before, so there’s no copy to show. Anything you were writing is still saved on this device — reconnect and it will be offered back to you.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
