<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#04102a;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const TAU = Math.PI * 2;

// Brand palette, matching the hero's CSS gradient.
const NAVY_950 = '#04102a', NAVY_800 = '#081d44', NAVY_700 = '#0b2559';
const SAGE = [163, 187, 140];       // --sage-300
const STEEL = [126, 160, 214];      // cool blue for data marks

// Deterministic RNG so every render of the scene is identical.
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry(20260819);

// --- Node field -----------------------------------------------------------
// Biased to the right two-thirds: the left stays clear behind the headline.
const NODES = Array.from({ length: 26 }, () => {
  const bx = 0.34 + Math.pow(rnd(), 0.85) * 0.72;
  const by = 0.06 + rnd() * 0.80;
  return {
    bx: bx * W, by: by * H,
    ax: (6 + rnd() * 22), ay: (6 + rnd() * 20),
    ph: rnd() * TAU, ph2: rnd() * TAU,
    r: 1.4 + rnd() * 1.9,
    pulse: rnd() * TAU,
    depth: 0.45 + rnd() * 0.55,   // dimmer nodes read as further away
  };
});

// --- Bars -----------------------------------------------------------------
const BARS = Array.from({ length: 13 }, (_, i) => ({
  base: 0.26 + i * 0.055 + rnd() * 0.09,
  amp: 0.012 + rnd() * 0.020,
  ph: rnd() * TAU,
}));

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const smoothstep = (e0, e1, x) => {
  const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return u * u * (3 - 2 * u);
};

function background() {
  const g = ctx.createLinearGradient(0, 0, W * 0.95, H);
  g.addColorStop(0, NAVY_950);
  g.addColorStop(0.55, NAVY_800);
  g.addColorStop(1, NAVY_700);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Perspective floor: horizontal rails converging on a vanishing point, drifting
// toward the viewer. Spacing is 1/d, so advancing d by exactly 1 over the loop
// puts every rail where its neighbour was — a seamless cycle.
function grid(t) {
  const vpx = W * 0.70, horizon = H * 0.40;
  ctx.save();
  ctx.lineWidth = 1;

  // Rails receding toward the horizon. Spacing is 1/d, so advancing d by exactly
  // 1 over the loop puts every rail where its neighbour was — a seamless cycle.
  for (let i = 1; i <= 30; i++) {
    const d = i + t;
    const y = horizon + (H * 0.78) / d;
    if (y > H + 2) continue;
    // Fade in at the bottom edge as a rail enters, out again near the horizon.
    const fade = Math.min(1, (d - 1) / 1.5) * Math.pow(1 - (d - 1) / 30, 1.6);
    ctx.strokeStyle = rgba(STEEL, 0.26 * fade);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Converging rails, each stroked with a gradient that dissolves as it nears
  // the vanishing point — otherwise they collide into a hard starburst.
  for (let i = -18; i <= 18; i++) {
    if (i === 0) continue;
    const xBottom = vpx + i * W * 0.155;
    const a = 0.20 * Math.pow(1 - Math.abs(i) / 20, 1.3);
    const g = ctx.createLinearGradient(vpx, horizon, xBottom, H);
    g.addColorStop(0, rgba(STEEL, 0));
    g.addColorStop(0.28, rgba(STEEL, a * 0.55));
    g.addColorStop(1, rgba(STEEL, a));
    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(vpx, horizon);
    ctx.lineTo(xBottom, H);
    ctx.stroke();
  }
  ctx.restore();
}

// Soft light drifting on a closed elliptical path — one full circuit per loop.
function light(t) {
  const cx = W * (0.62 + 0.17 * Math.cos(t * TAU));
  const cy = H * (0.34 + 0.20 * Math.sin(t * TAU));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.42);
  g.addColorStop(0, rgba(SAGE, 0.085));
  g.addColorStop(0.45, rgba(STEEL, 0.035));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function network(t) {
  const pts = NODES.map(n => ({
    x: n.bx + n.ax * Math.cos(t * TAU + n.ph),
    y: n.by + n.ay * Math.sin(t * TAU + n.ph2),
    r: n.r * (1 + 0.22 * Math.sin(t * TAU * 2 + n.pulse)),
    depth: n.depth,
  }));

  ctx.save();
  const LINK = W * 0.235;
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      const d = Math.hypot(dx, dy);
      if (d > LINK) continue;
      const a = Math.pow(1 - d / LINK, 1.4) * 0.42 * pts[i].depth * pts[j].depth;
      ctx.strokeStyle = rgba(STEEL, a);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
    }
  }
  for (const p of pts) {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
    g.addColorStop(0, rgba(STEEL, 0.55 * p.depth));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba([222, 236, 255], 0.62 * p.depth);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Bars and the trend line that rises across them.
function chart(t) {
  const x0 = W * 0.50, x1 = W * 0.97, baseY = H * 0.865;
  const span = x1 - x0, bw = span / BARS.length;

  ctx.save();
  BARS.forEach((b, i) => {
    const h = (b.base + b.amp * Math.sin(t * TAU + b.ph)) * H * 0.30;
    const x = x0 + i * bw;
    const g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
    g.addColorStop(0, rgba(STEEL, 0.17));
    g.addColorStop(1, rgba(STEEL, 0.02));
    ctx.fillStyle = g;
    ctx.fillRect(x, baseY - h, bw * 0.52, h);
  });

  // Trend line through the bar tops, smoothed and lifted.
  const pts = BARS.map((b, i) => {
    const h = (b.base + b.amp * Math.sin(t * TAU + b.ph)) * H * 0.30;
    return { x: x0 + i * bw + bw * 0.26, y: baseY - h - H * 0.045 };
  });

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  ctx.strokeStyle = rgba(SAGE, 0.55);
  ctx.lineWidth = 2;
  ctx.shadowColor = rgba(SAGE, 0.5);
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // A marker tracking along the trend, one pass per loop. It runs end-to-end,
  // so it has to be invisible at both ends or it visibly snaps back at the seam.
  const k = t * (pts.length - 1);
  const i0 = Math.floor(k), f = k - i0;
  const p0 = pts[Math.min(i0, pts.length - 1)], p1 = pts[Math.min(i0 + 1, pts.length - 1)];
  const mx = p0.x + (p1.x - p0.x) * f, my = p0.y + (p1.y - p0.y) * f;
  const vis = smoothstep(0, 0.16, t) * smoothstep(0, 0.16, 1 - t); // fully out at both ends
  if (vis > 0.004) {
    const g2 = ctx.createRadialGradient(mx, my, 0, mx, my, 26);
    g2.addColorStop(0, rgba(SAGE, 0.55 * vis));
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(mx, my, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(235,244,225,${0.92 * vis})`;
    ctx.beginPath(); ctx.arc(mx, my, 3.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Readability masks. The headline sits left; the credibility row sits low.
function masks() {
  let g = ctx.createLinearGradient(0, 0, W * 0.78, 0);
  g.addColorStop(0.00, 'rgba(4,16,42,0.94)');
  g.addColorStop(0.30, 'rgba(4,16,42,0.80)');
  g.addColorStop(0.62, 'rgba(4,16,42,0.34)');
  g.addColorStop(1.00, 'rgba(4,16,42,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  g = ctx.createLinearGradient(0, H, 0, H * 0.55);
  g.addColorStop(0, 'rgba(4,16,42,0.58)');
  g.addColorStop(1, 'rgba(4,16,42,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  g = ctx.createLinearGradient(0, 0, 0, H * 0.22);
  g.addColorStop(0, 'rgba(4,16,42,0.55)');
  g.addColorStop(1, 'rgba(4,16,42,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

window.renderFrame = function (t) {
  ctx.clearRect(0, 0, W, H);
  background();
  grid(t);
  light(t);
  network(t);
  chart(t);
  masks();
  return true;
};
window.renderFrame(0);
</script></body></html>
